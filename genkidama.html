<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元気玉ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); /* カメラを鏡面反転 */ }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        .glass-panel { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        
        #start-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 50; }
        
        /* 爆発時の画面揺れエフェクト */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body>

    <!-- 映像表示用Canvas -->
    <video id="videoElement" style="display: none;" playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <!-- UIオーバーレイ -->
    <div class="ui-layer" id="ui-layer">
        <div class="text-center w-full">
            <h1 class="text-3xl font-bold text-blue-300 drop-shadow-[0_0_10px_rgba(59,130,246,0.8)] tracking-widest">元気玉メーカー</h1>
            <p id="status-text" class="text-xl mt-2 font-bold text-yellow-300 drop-shadow-md">カメラを起動してください</p>
        </div>
        
        <div class="glass-panel p-4 mb-8 max-w-md mx-auto text-center">
            <h2 class="text-lg font-bold text-blue-200 mb-2">【遊び方】</h2>
            <p class="text-sm">① 画面から少し離れて立ちます<br>② <span class="text-yellow-300">両手を高く挙げて</span>エネルギーを集めます<br>③ 玉が大きくなったら、<span class="text-red-400">手を勢いよく前に振り下ろして</span>放て！</p>
        </div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="interactive">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 mb-8 drop-shadow-lg text-center">
            元気玉<br><span class="text-2xl md:text-4xl text-white">ジェネレーター</span>
        </h1>
        <button id="start-btn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full text-xl shadow-[0_0_20px_rgba(37,99,235,0.6)] transition-all transform hover:scale-105 active:scale-95">
            カメラを起動して開始
        </button>
        <p class="mt-4 text-gray-400 text-sm">※全身、または上半身がカメラに映るようにしてください</p>
        <div id="loading-text" class="hidden mt-4 text-blue-300 font-bold animate-pulse">
            AIモデルを読み込み中... 少しお待ちください
        </div>
    </div>

<script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const loadingText = document.getElementById('loading-text');
    const statusText = document.getElementById('status-text');

    // --- ゲームステート ---
    let state = 'idle'; // idle, charging, throwing, exploding
    let ballRadius = 0;
    const MAX_BALL_RADIUS = 200;
    let ballPos = { x: 0, y: 0, z: 1 }; // zはスケール用(遠近感)
    let throwVelocity = { x: 0, y: 0, z: 0 };
    let particles = [];
    
    // キャンバスのリサイズ
    function resizeCanvas() {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- パーティクル（爆発エフェクト）クラス ---
    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 20 + 5;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.015;
            this.color = Math.random() > 0.5 ? '200, 240, 255' : '100, 200, 255'; // 白〜水色
            this.size = Math.random() * 10 + 5;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            // エラー防止: lifeがマイナスになった時に半径がマイナスにならないようにする
            const currentLife = Math.max(0, this.life);
            if (currentLife === 0) return;
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * currentLife, 0, 2 * Math.PI);
            ctx.fillStyle = `rgba(${this.color}, ${currentLife})`;
            ctx.fill();
        }
    }

    function createExplosion(x, y) {
        document.body.classList.add('shake-active');
        setTimeout(() => document.body.classList.remove('shake-active'), 500);
        
        for (let i = 0; i < 150; i++) {
            particles.push(new Particle(x, y));
        }
    }

    // --- 描画ループ ---
    // MediaPipeの結果からカメラ映像を描画した「後」に呼ばれるように、onResults内で描画処理を実行します。

    function onResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // カメラ映像の描画 (Canvas自体がCSSでscaleX(-1)されているため、そのまま描画してOK)
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        // --- 状態推移と座標計算 ---
        let isHandsUp = false;
        let isThrowing = false;
        let headX = canvasElement.width / 2;
        let headY = canvasElement.height / 3;

        if (results.poseLandmarks) {
            const landmarks = results.poseLandmarks;
            const lWrist = landmarks[15];
            const rWrist = landmarks[16];
            const lShoulder = landmarks[11];
            const rShoulder = landmarks[12];
            const nose = landmarks[0];

            // 座標をキャンバスサイズにマッピング (CSSで反転しているので座標はそのまま)
            const mapX = (x) => x * canvasElement.width;
            const mapY = (y) => y * canvasElement.height;

            headX = mapX(nose.x);
            headY = mapY(nose.y);

            // 信頼度が低い場合は無視
            if (lWrist.visibility > 0.5 && rWrist.visibility > 0.5 && lShoulder.visibility > 0.5) {
                
                // 【条件1: チャージ】両手首が肩より上（Y座標が小さい）にあるか
                if (lWrist.y < lShoulder.y && rWrist.y < rShoulder.y) {
                    isHandsUp = true;
                    // 手の中心座標を計算し、さらに少し上に玉を配置
                    const handsCenterX = mapX((lWrist.x + rWrist.x) / 2);
                    const handsCenterY = mapY(Math.min(lWrist.y, rWrist.y)) - 100; // 手の最も高い位置から少し上
                    
                    // 目標位置にスムーズに追従
                    ballPos.x += (handsCenterX - ballPos.x) * 0.2;
                    ballPos.y += (handsCenterY - ballPos.y) * 0.2;
                }
                
                // 【条件2: 投げる】チャージ中で玉が一定サイズ以上あり、手首が肩より下に下がった時
                if (state === 'charging' && ballRadius > 40) {
                    // 手を振り下ろしたか判定 (手首が肩より下になった瞬間)
                    if (lWrist.y > lShoulder.y || rWrist.y > rShoulder.y) {
                        isThrowing = true;
                    }
                }
            }
        }

        // --- ステートマシンの更新 ---
        if (state === 'idle') {
            statusText.innerText = "両手を高く挙げて元気を集めろ！";
            statusText.className = "text-xl mt-2 font-bold text-yellow-300 drop-shadow-md";
            ballRadius = Math.max(0, ballRadius - 5); // すぐに消える
            
            if (isHandsUp) {
                state = 'charging';
                // 玉の位置を初期化（頭上）
                if(ballRadius === 0) {
                    ballPos.x = headX;
                    ballPos.y = headY - 150;
                    ballPos.z = 1;
                }
            }

        } else if (state === 'charging') {
            statusText.innerText = "もっとだ...！もっと元気を分けてくれ！";
            statusText.className = "text-2xl mt-2 font-bold text-cyan-300 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)] animate-pulse";
            
            if (isHandsUp) {
                // 玉を大きくする
                ballRadius = Math.min(MAX_BALL_RADIUS, ballRadius + 1.5);
            } else if (!isThrowing) {
                // 手を下ろしてしまった場合（キャンセル）
                state = 'idle';
            }

            if (isThrowing) {
                state = 'throwing';
                statusText.innerText = "いけえええええ！！";
                statusText.className = "text-4xl mt-2 font-black text-red-500 drop-shadow-[0_0_10px_rgba(239,68,68,1)]";
                
                // 投げるベクトルの計算 (画面中央奥に向かって飛ばす)
                const targetX = canvasElement.width / 2;
                const targetY = canvasElement.height / 2;
                throwVelocity.x = (targetX - ballPos.x) * 0.05;
                throwVelocity.y = (targetY - ballPos.y) * 0.05;
                throwVelocity.z = -0.04; // スケールを小さくして奥に行く表現
            }

        } else if (state === 'throwing') {
            // 飛んでいくアニメーション
            ballPos.x += throwVelocity.x;
            ballPos.y += throwVelocity.y;
            ballPos.z += throwVelocity.z;

            // 一定以上奥に行ったら（スケールが小さくなったら）爆発
            if (ballPos.z <= 0.2) {
                state = 'exploding';
                createExplosion(ballPos.x, ballPos.y);
                ballRadius = 0; // 玉は消す
            }

        } else if (state === 'exploding') {
            statusText.innerText = "ドカーン！！";
            // パーティクルが全て消えたらidleに戻る
            if (particles.length === 0) {
                setTimeout(() => { state = 'idle'; }, 1000);
            }
        }

        // --- 描画処理 ---
        
        // 1. 元気玉の描画
        if (ballRadius > 0 && state !== 'exploding') {
            // z値に基づいてスケールを変更
            const currentRadius = ballRadius * Math.max(0.1, ballPos.z);
            
            // オーラ（外側の光）
            const gradient = canvasCtx.createRadialGradient(
                ballPos.x, ballPos.y, currentRadius * 0.1,
                ballPos.x, ballPos.y, currentRadius * 1.5
            );
            
            // チャージ中は脈動する
            const pulse = state === 'charging' ? Math.sin(Date.now() / 100) * 0.1 + 0.9 : 1;

            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');      // コア：白
            gradient.addColorStop(0.2, 'rgba(200, 240, 255, 0.9)');    // 内側：水色
            gradient.addColorStop(0.6, `rgba(50, 150, 255, ${0.6 * pulse})`); // オーラ：青
            gradient.addColorStop(1, 'rgba(0, 50, 255, 0)');         // 外周：透明

            canvasCtx.beginPath();
            canvasCtx.arc(ballPos.x, ballPos.y, currentRadius * 1.5, 0, 2 * Math.PI);
            canvasCtx.fillStyle = gradient;
            canvasCtx.fill();
        }

        // 2. 爆発パーティクルの描画
        if (particles.length > 0) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(canvasCtx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        // 3. 爆発時のフラッシュオーバーレイ
        if (state === 'exploding' && particles.length > 100) {
            const alpha = (particles.length - 100) / 50; // 最初の数フレームで白く光る
            canvasCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }

        canvasCtx.restore();
    }

    // --- MediaPipe Poseの初期化 ---
    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    // カメラのセットアップ
    let camera;

    startBtn.addEventListener('click', async () => {
        startBtn.classList.add('hidden');
        loadingText.classList.remove('hidden');

        try {
            // カメラ権限の要求とストリームの取得
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 1280, height: 720, facingMode: "user" } 
            });
            videoElement.srcObject = stream;
            
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            
            camera.start().then(() => {
                // カメラ起動成功後、スタート画面を非表示
                startScreen.style.display = 'none';
            });
            
        } catch (error) {
            console.error("Camera error:", error);
            alert("カメラの起動に失敗しました。ブラウザのカメラ権限を許可してください。");
            startBtn.classList.remove('hidden');
            loadingText.classList.add('hidden');
        }
    });

</script>
</body>
</html>
