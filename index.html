<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かめはめ波ジェネレーター</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose (骨格検知) の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        /* 修正: iframe埋め込み時に高さが潰れて真っ白になるのを防ぐため、htmlとbodyに100%を指定 */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* 修正: 100vw/100vh ではなく 100% を使用 */
        #canvas-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background-color: #000; }
        
        video { display: none; } /* ビデオは非表示にし、Canvasに描画する */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* 鏡像反転 */ }
        
        /* UIオーバーレイ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        
        /* エフェクト用のシェイクアニメーション */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg) scaleX(-1); }
            10% { transform: translate(-1px, -2px) rotate(-1deg) scaleX(-1); }
            20% { transform: translate(-3px, 0px) rotate(1deg) scaleX(-1); }
            30% { transform: translate(3px, 2px) rotate(0deg) scaleX(-1); }
            40% { transform: translate(1px, -1px) rotate(1deg) scaleX(-1); }
            50% { transform: translate(-1px, 2px) rotate(-1deg) scaleX(-1); }
            60% { transform: translate(-3px, 1px) rotate(0deg) scaleX(-1); }
            70% { transform: translate(3px, 1px) rotate(-1deg) scaleX(-1); }
            80% { transform: translate(-1px, -1px) rotate(1deg) scaleX(-1); }
            90% { transform: translate(1px, 2px) rotate(0deg) scaleX(-1); }
            100% { transform: translate(1px, -2px) rotate(-1deg) scaleX(-1); }
        }
        .shaking { animation: shake 0.1s infinite; }

        /* スタート画面 */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 20; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-end; padding: 20px; box-sizing: border-box; pointer-events: none; transition: opacity 0.5s ease-out; }
        #start-screen > * { pointer-events: auto; }
    </style>
</head>
<body>

<div id="canvas-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-layer">
        <div class="text-xl font-bold text-blue-300 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
            エネルギー: <span id="charge-text">0</span>%
        </div>
        <div class="text-center mb-10 text-lg font-bold drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]" id="instruction-text">
            カメラに全身（上半身）を映してください
        </div>
    </div>

    <div id="start-screen">
        <h1 class="text-3xl md:text-4xl font-extrabold text-blue-400 mb-4 drop-shadow-[0_0_10px_rgba(59,130,246,0.8)] text-right">かめはめ波<br class="md:hidden">ジェネレーター</h1>
        <div class="bg-gray-800/80 p-4 md:p-6 rounded-xl text-left mb-6 max-w-xs md:max-w-md">
            <h2 class="text-lg md:text-xl font-bold mb-2 md:mb-3 text-yellow-300">遊び方</h2>
            <ol class="list-decimal list-inside space-y-1 md:space-y-2 text-gray-200 text-sm md:text-base">
                <li>カメラのアクセスを許可。</li>
                <li><strong>【溜める】</strong> 腰のあたりで両手を合わせる。</li>
                <li><strong>【放つ】</strong> 合わせた両手を前に勢いよく突き出す！</li>
            </ol>
        </div>
        
        <div id="btn-container" class="flex flex-col items-end">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full text-xl transition duration-300 shadow-[0_0_20px_rgba(37,99,235,0.6)] hover:shadow-[0_0_30px_rgba(59,130,246,1)] hover:scale-105">
                開始
            </button>
            <div id="loading-text" class="hidden mt-4 text-blue-300 animate-pulse font-bold text-lg text-right">モデルを読み込み中...</div>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const loadingText = document.getElementById('loading-text');
    const chargeText = document.getElementById('charge-text');
    const instructionText = document.getElementById('instruction-text');

    // 状態管理
    let isModelLoaded = false;
    let chargeLevel = 0;
    let isFiring = false;
    let fireTimer = 0;
    const MAX_FIRE_FRAMES = 45;
    let lastWristPos = { x: 0, y: 0 };
    let particles = [];

    class Particle {
        constructor(x, y, isFiringMode, angleVector = null) {
            this.x = x;
            this.y = y;
            this.isFiringMode = isFiringMode;
            this.life = 1.0;
            this.decay = Math.random() * 0.05 + 0.02;
            this.size = Math.random() * 5 + 2;
            
            if (isFiringMode && angleVector) {
                let speed = Math.random() * 30 + 15;
                let spread = (Math.random() - 0.5) * 0.5;
                this.vx = (angleVector.x + spread) * speed;
                this.vy = (angleVector.y + spread) * speed;
            } else {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 5 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }
        }

        update(targetX, targetY) {
            if (!this.isFiringMode) {
                let dx = targetX - this.x;
                let dy = targetY - this.y;
                this.vx += dx * 0.01;
                this.vy += dy * 0.01;
                this.vx *= 0.85;
                this.vy *= 0.85;
            }
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }

        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.isFiringMode ? '#ffffff' : '#a5f3fc';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function resizeCanvas() {
        // コンテナのサイズに合わせてキャンバスをリサイズ
        const container = document.getElementById('canvas-container');
        canvasElement.width = container.clientWidth;
        canvasElement.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    // 初期化時に少し遅らせてリサイズを実行（埋め込み時のサイズ取得漏れ防止）
    setTimeout(resizeCanvas, 100);

    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    let camera;
    
    startBtn.addEventListener('click', async () => {
        startBtn.classList.add('hidden');
        loadingText.classList.remove('hidden');
        
        try {
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await pose.send({image: videoElement});
                },
                width: 1280,
                height: 720
            });
            await camera.start();
        } catch (error) {
            alert('カメラの起動に失敗しました。ブラウザのカメラ権限を確認してください。');
            startBtn.classList.remove('hidden');
            loadingText.classList.add('hidden');
        }
    });

    function getDistance(p1, p2) {
        return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function onResults(results) {
        if (!isModelLoaded) {
            isModelLoaded = true;
            loadingText.innerText = "準備完了！両手を合わせてみて！";
            loadingText.classList.remove('animate-pulse', 'text-blue-300');
            loadingText.classList.add('text-green-400', 'animate-bounce');
        }

        const w = canvasElement.width;
        const h = canvasElement.height;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, w, h);
        
        canvasCtx.drawImage(results.image, 0, 0, w, h);

        let detected = false;

        if (results.poseLandmarks) {
            const landmarks = results.poseLandmarks;
            
            const leftShoulder = { x: landmarks[11].x * w, y: landmarks[11].y * h };
            const rightShoulder = { x: landmarks[12].x * w, y: landmarks[12].y * h };
            const leftWrist = { x: landmarks[15].x * w, y: landmarks[15].y * h };
            const rightWrist = { x: landmarks[16].x * w, y: landmarks[16].y * h };

            const midShoulder = { x: (leftShoulder.x + rightShoulder.x) / 2, y: (leftShoulder.y + rightShoulder.y) / 2 };
            const midWrist = { x: (leftWrist.x + rightWrist.x) / 2, y: (leftWrist.y + rightWrist.y) / 2 };

            const wristDist = getDistance(leftWrist, rightWrist);
            const extensionDist = getDistance(midShoulder, midWrist);

            const HANDS_TOGETHER_THRESHOLD = w * 0.25;
            const ARM_EXTENSION_THRESHOLD = w * 0.35;

            detected = true;
            lastWristPos = midWrist;

            if (isFiring) {
                fireTimer--;
                drawBeam(midWrist, midShoulder, w, h);
                instructionText.innerText = "かめはめ波ーーー！！！";
                instructionText.className = "text-center mb-10 text-4xl font-extrabold text-blue-300 drop-shadow-[0_0_10px_rgba(255,255,255,1)] animate-bounce";
                
                if (fireTimer <= 0) {
                    isFiring = false;
                    chargeLevel = 0;
                    canvasElement.classList.remove('shaking');
                }
            } else {
                if (wristDist < HANDS_TOGETHER_THRESHOLD) {
                    if (extensionDist < ARM_EXTENSION_THRESHOLD) {
                        chargeLevel = Math.min(chargeLevel + 2.5, 100);
                        
                        if (startScreen.style.opacity !== '0' && !startScreen.classList.contains('hidden')) {
                            startScreen.style.opacity = '0';
                            setTimeout(() => { startScreen.classList.add('hidden'); }, 500);
                        }

                        drawEnergyBall(midWrist.x, midWrist.y, chargeLevel);
                        instructionText.innerText = "エネルギーを溜めています...";
                        instructionText.className = "text-center mb-10 text-2xl font-bold text-yellow-300 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] animate-pulse";
                        
                        if (Math.random() > 0.5) {
                            particles.push(new Particle(
                                midWrist.x + (Math.random() - 0.5) * 200, 
                                midWrist.y + (Math.random() - 0.5) * 200, 
                                false
                            ));
                        }
                    } else if (chargeLevel > 30) {
                        isFiring = true;
                        fireTimer = MAX_FIRE_FRAMES;
                        canvasElement.classList.add('shaking');
                    } else {
                        chargeLevel = Math.max(chargeLevel - 0.5, 0);
                        instructionText.innerText = "腰のあたりで手を合わせて溜めよう";
                        instructionText.className = "text-center mb-10 text-lg font-bold text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]";
                    }
                } else {
                    chargeLevel = Math.max(chargeLevel - 1.0, 0);
                    if (chargeLevel > 0) {
                        drawEnergyBall(midWrist.x, midWrist.y, chargeLevel);
                        instructionText.innerText = "手を離さないで！";
                        instructionText.className = "text-center mb-10 text-xl font-bold text-red-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]";
                    } else {
                        instructionText.innerText = "両手を合わせてエネルギーを溜めよう";
                        instructionText.className = "text-center mb-10 text-lg font-bold text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]";
                    }
                }
            }
        } else {
            chargeLevel = Math.max(chargeLevel - 2, 0);
            instructionText.innerText = "カメラに全身（上半身）を映してください";
            instructionText.className = "text-center mb-10 text-lg font-bold text-gray-300 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]";
        }

        chargeText.innerText = Math.floor(chargeLevel);

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update(lastWristPos.x, lastWristPos.y);
            p.draw(canvasCtx);
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        canvasCtx.restore();
    }

    function drawEnergyBall(x, y, level) {
        if (level <= 0) return;
        
        const baseRadius = level * 1.5;
        const radius = baseRadius + Math.random() * 10; 
        
        canvasCtx.save();
        canvasCtx.globalCompositeOperation = "screen";

        const gradient = canvasCtx.createRadialGradient(x, y, radius * 0.1, x, y, radius);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.3, 'rgba(134, 239, 253, 0.8)');
        gradient.addColorStop(0.8, 'rgba(59, 130, 246, 0.4)');
        gradient.addColorStop(1, 'rgba(29, 78, 216, 0)');

        canvasCtx.beginPath();
        canvasCtx.arc(x, y, radius, 0, 2 * Math.PI);
        canvasCtx.fillStyle = gradient;
        canvasCtx.fill();

        canvasCtx.restore();
    }

    function drawBeam(wristPos, shoulderPos, w, h) {
        canvasCtx.save();
        canvasCtx.globalCompositeOperation = "screen";

        let dirX = wristPos.x - shoulderPos.x;
        let dirY = wristPos.y - shoulderPos.y;
        
        if (Math.hypot(dirX, dirY) < 10) {
            dirX = 0;
            dirY = -1;
        }

        const length = Math.hypot(dirX, dirY);
        dirX /= length;
        dirY /= length;

        const extendDist = Math.max(w, h) * 2;
        const endX = wristPos.x + dirX * extendDist;
        const endY = wristPos.y + dirY * extendDist;

        const beamWidth = chargeLevel * 3 + Math.random() * 20;

        canvasCtx.beginPath();
        canvasCtx.moveTo(wristPos.x, wristPos.y);
        canvasCtx.lineTo(endX, endY);
        canvasCtx.lineWidth = beamWidth;
        canvasCtx.lineCap = "round";
        canvasCtx.strokeStyle = 'rgba(59, 130, 246, 0.6)';
        canvasCtx.shadowColor = '#3b82f6';
        canvasCtx.shadowBlur = 50;
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(wristPos.x, wristPos.y);
        canvasCtx.lineTo(endX, endY);
        canvasCtx.lineWidth = beamWidth * 0.6;
        canvasCtx.strokeStyle = 'rgba(134, 239, 253, 0.8)';
        canvasCtx.shadowColor = '#67e8f9';
        canvasCtx.shadowBlur = 20;
        canvasCtx.stroke();

        canvasCtx.beginPath();
        canvasCtx.moveTo(wristPos.x, wristPos.y);
        canvasCtx.lineTo(endX, endY);
        canvasCtx.lineWidth = beamWidth * 0.3;
        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 1)';
        canvasCtx.shadowBlur = 0;
        canvasCtx.stroke();

        drawEnergyBall(wristPos.x, wristPos.y, chargeLevel * 1.5);

        for(let i=0; i<5; i++) {
            particles.push(new Particle(wristPos.x, wristPos.y, true, {x: dirX, y: dirY}));
        }

        canvasCtx.restore();
    }
</script>

</body>
</html>
